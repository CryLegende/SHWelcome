name: SHWelcome
version: '${project.version}'
main: org.Cry_Legende.sHWelcome.SHWelcome
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, chaque serveur accueille ses propres nouveaux joueurs comme avant.
softdepend:
  - SHLogs
  - SHNetwork
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (accueils en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  bienvenue:
    description: Souhaiter la bienvenue à un nouveau joueur
    usage: /bienvenue [pseudo]
    aliases: [b]
  shwelcome:
    description: Administration de SHWelcome.
    usage: /shwelcome reload

permissions:
  shwelcome.use:
    description: Souhaiter la bienvenue à un nouveau joueur (/bienvenue, alias /b).
    default: true
  shwelcome.admin:
    description: Toutes les sous-commandes de /shwelcome.
    default: op
    children:
      shwelcome.admin.reload: true
  shwelcome.admin.reload:
    description: Recharger config.yml et messages.yml (/shwelcome reload).
    default: op
