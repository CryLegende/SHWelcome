# ======================================================================== #
#                    SHWelcome - Fichier de Messages                       #
# ======================================================================== #
#
# Les codes couleur utilisent '&'.
#
# Variables :
#   %player%    Pseudo du nouveau joueur (clickable_message, clickable_hover).
#   %limit%     Limite de bienvenues récompensées par jour (daily_limit_reached).
#   %commands%  Sous-commandes autorisées (usage-line).
#   %file%, %line%, %error%  Fichier, ligne et problème d'un YAML illisible (reload-failed).
#
# ======================================================================== #

# Message cliquable envoyé aux autres joueurs quand un nouveau joueur arrive.
clickable_message: "&3&l« &6Cliquez ici &fpour souhaiter le bienvenue à &6%player% &b&l»"

# Texte affiché au survol du message cliquable.
clickable_hover: "Cliquez pour accueillir %player%"

# Aucun nouveau joueur à accueillir.
no_new_players: "&7&l« &c&lSH &8&l» &7Aucun nouveau joueur à accueillir."

# Le délai pour accueillir ce joueur est dépassé.
cooldown_expired: "&7&l« &c&lSH &8&l» &7Trop tard pour accueillir ce joueur."

# Le joueur a déjà accueilli ce nouveau joueur.
already_welcomed: "&7&l« &c&lSH &8&l» &7Vous avez déjà accueilli ce joueur."

# Limite quotidienne atteinte : la bienvenue est envoyée sans récompense.
daily_limit_reached: "&7&l« &c&lSH &8&l» &7Limite quotidienne atteinte (%limit% accueils/jour)"

# Base des accueils injoignable (SHNetwork) : rien n'est compté, le joueur peut réessayer.
service_unavailable: "&7&l« &c&lSH &8&l» &7Accueil impossible pour le moment, réessayez dans un instant."

# /bienvenue lancée depuis la console.
player-only: "&7&l« &c&lSH &8&l» &7Cette commande est réservée aux &cjoueurs&7."

# /bienvenue sans la permission shwelcome.use, ou /shwelcome sans aucun droit d'administration.
no-permission: "&7&l« &f&lSH &8&l» &fCommande inconnue, essayez autre chose."

# /shwelcome sans sous-commande ou avec une sous-commande inconnue.
# Variable : %commands% (sous-commandes que l'expéditeur a le droit d'utiliser).
usage-line: "&7&l« &e&lSH &8&l» &7Utilisation : &e/shwelcome &7<&e%commands%&7>"

# /shwelcome reload.
reload: "&7&l« &a&lSH &8&l» &7Configuration &arechargée&7."

# Fichier YAML illisible : l'ancienne configuration reste en place.
# Variables : %file% (fichier), %line% (ligne), %error% (problème relevé).
reload-failed: "&7&l« &c&lSH &8&l» &7Rechargement &cimpossible &7: &c%file% &7ligne &c%line%&7, %error%. Ancienne configuration conservée."

# La section 'reseau' de config.yml a changé : elle ne se recharge pas à chaud.
reload-network: "&7&l« &6&lSH &8&l» &7La section &6reseau &7demande un &6redémarrage&7 pour être prise en compte."

