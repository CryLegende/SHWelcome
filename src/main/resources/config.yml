# Liens du serveur : boutons du menu pause (« Liens du serveur », clients 1.21+). Les clients plus
# anciens ignorent simplement ce paquet. Le libellé accepte les codes couleur avec '&'.
# actif: false sur une entrée (ou sur toute la liste) la retire. Pris en compte au démarrage du plugin.
liens-serveur:
  actif: true
  liens:
    - libelle: '&9&lDiscord'
      url: 'https://discord.skyhand.fr'
      actif: true
    - libelle: '&b&lSite web'
      url: 'https://skyhand.fr'
      actif: true
    - libelle: '&d&lVote'
      url: 'https://skyhand.fr/vote'
      actif: true
    - libelle: '&a&lBoutique'
      url: 'https://store.skyhand.fr'
      actif: true
